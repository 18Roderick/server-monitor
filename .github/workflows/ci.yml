name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: monitoruser
          POSTGRES_PASSWORD: '123456'
          POSTGRES_DB: pingdom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U monitoruser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://monitoruser:123456@localhost:5432/pingdom
      TEST_DATABASE_URL: postgres://monitoruser:123456@localhost:5432/pingdom
      # only used to satisfy Config.ts at boot for the migration step — no
      # Redis service is needed since no test in this suite connects to it
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      JWT_SECRET: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint:ci

      - name: Build
        run: pnpm build

      - name: Run database migrations
        run: pnpm --filter server run db:migrate

      - name: Test
        run: pnpm test
